# /etc/nginx/sites-available/riftbound
# HTTPS ensuite avec : sudo certbot --nginx -d riftbound.example.com
server {
    listen 80;
    server_name riftbound.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La synchronisation manuelle peut prendre ~10 s
        proxy_read_timeout 120s;
    }
}
